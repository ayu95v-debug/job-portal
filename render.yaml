services:
  - type: web
    name: job-portal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_USER
        value: yourgmail@gmail.com
      - key: EMAIL_PASS
        value: your_gmail_app_password
      - key: EMAIL_FROM
        value: yourgmail@gmail.com

  - type: static
    name: job-portal-frontend
    rootDir: frontend
    buildCommand: |
      npm install
      REACT_APP_API_URL=https://job-portal-backend.onrender.com npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://job-portal-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Note: if your backend Render service has a different generated hostname,
# update REACT_APP_API_URL to match that exact backend URL.
